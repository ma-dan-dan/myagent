<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title desc">
  <title id="title">MyAgent 当前架构与 V7 Fix RAG 和 LangGraph NL2SQL 链路</title>
  <desc id="desc">展示 FastAPI 请求、意图路由、Agentic Chat、DDL 与 SampleValue RAG，以及具备上下文、校验、只读执行和反思回环的 V7 LangGraph NL2SQL 工作流。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#c7e2ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4f8ed"/>
      <stop offset="100%" stop-color="#ccefdc"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d5"/>
      <stop offset="100%" stop-color="#ffe1ad"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee5ff"/>
      <stop offset="100%" stop-color="#dfd0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 30px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .label { font: 700 18px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .small { font: 400 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #334155; }
      .tiny { font: 400 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .section { font: 700 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; letter-spacing: 1px; }
      .box { stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .current { stroke: #6aa6d8; fill: url(#blue); }
      .intent { stroke: #66b889; fill: url(#green); }
      .planned { stroke: #e6a642; fill: url(#orange); stroke-dasharray: 9 7; }
      .rag { stroke: #e6a642; fill: url(#orange); }
      .storage { stroke: #9877d1; fill: url(#purple); }
      .muted { stroke: #94a3b8; fill: #f8fafc; }
      .line { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .plannedLine { stroke: #d97706; stroke-width: 2.2; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrowOrange); }
      .ragLine { stroke: #d97706; stroke-width: 2.2; fill: none; marker-end: url(#arrowOrange); }
      .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 8; }
    </style>
  </defs>

  <rect width="1600" height="1380" fill="url(#background)"/>
  <text x="70" y="62" class="title">MyAgent 当前架构与 V7 Fix RAG + LangGraph NL2SQL 链路</text>
  <text x="70" y="91" class="subtitle">全部为当前已接入链路　·　灰蓝为服务编排，橙色为 RAG / NL2SQL，紫色为会话与模型基础设施</text>

  <rect x="630" y="120" width="340" height="64" class="box current"/>
  <text x="800" y="148" text-anchor="middle" class="label">Web / API Request</text>
  <text x="800" y="171" text-anchor="middle" class="small">FastAPI + Native HTML</text>

  <path d="M800 184 L800 220" class="line"/>
  <rect x="610" y="220" width="380" height="68" class="box current"/>
  <text x="800" y="249" text-anchor="middle" class="label">ChatService</text>
  <text x="800" y="272" text-anchor="middle" class="small">会话、持久化、业务编排</text>

  <path d="M800 288 L800 324" class="line"/>
  <rect x="610" y="324" width="380" height="68" class="box intent"/>
  <text x="800" y="353" text-anchor="middle" class="label">IntentRouter</text>
  <text x="800" y="376" text-anchor="middle" class="small">chat / data_operation / nl2sql</text>

  <path d="M800 392 L800 420" class="line"/>
  <rect x="300" y="420" width="280" height="76" class="box intent"/>
  <text x="440" y="451" text-anchor="middle" class="label">Fake / Jev</text>
  <text x="440" y="475" text-anchor="middle" class="small">IntentClassifier</text>

  <rect x="660" y="420" width="280" height="76" class="box intent"/>
  <text x="800" y="451" text-anchor="middle" class="label">LLMIntentClassifier</text>
  <text x="800" y="475" text-anchor="middle" class="small">JSON + Pydantic 校验</text>

  <rect x="1020" y="420" width="280" height="76" class="box muted"/>
  <text x="1160" y="451" text-anchor="middle" class="label">IntentDecision</text>
  <text x="1160" y="475" text-anchor="middle" class="small">原始意图与路由结果分离</text>

  <path d="M800 392 L440 420" class="line"/>
  <path d="M800 392 L800 420" class="line"/>
  <path d="M800 392 L1160 420" class="line"/>
  <path d="M800 496 L800 525" class="line"/>

  <text x="110" y="548" class="section">ROUTING</text>
  <line x1="110" y1="560" x2="1490" y2="560" class="divider"/>

  <rect x="80" y="590" width="410" height="140" class="box current"/>
  <text x="285" y="625" text-anchor="middle" class="label">chat</text>
  <text x="285" y="651" text-anchor="middle" class="small">ContextManager → ChatAgent</text>
  <text x="285" y="676" text-anchor="middle" class="small">Chat LLMAdapter ↔ ToolRegistry</text>
  <text x="285" y="704" text-anchor="middle" class="tiny">Agent Loop · search_schema Tool</text>

  <rect x="595" y="590" width="410" height="140" class="box rag"/>
  <text x="800" y="625" text-anchor="middle" class="label">data_operation / read</text>
  <text x="800" y="651" text-anchor="middle" class="small">SchemaLinkingService → RRF Context</text>
  <text x="800" y="676" text-anchor="middle" class="small">ContextManager → ChatAgent(tools=[])</text>
  <text x="800" y="704" text-anchor="middle" class="tiny">一次主模型回答 · 不进入 Tool Loop</text>

  <rect x="1110" y="590" width="410" height="140" class="box rag"/>
  <text x="1315" y="625" text-anchor="middle" class="label">nl2sql · LangGraph</text>
  <text x="1315" y="651" text-anchor="middle" class="small">SchemaLinking → ContextPrepare</text>
  <text x="1315" y="676" text-anchor="middle" class="small">GenSQL ↔ Reflection → 安全输出</text>
  <text x="1315" y="704" text-anchor="middle" class="tiny">独立只读 SQLite · 不使用 Chat SQLite</text>

  <path d="M800 525 L285 590" class="line"/>
  <path d="M800 525 L800 590" class="ragLine"/>
  <path d="M800 525 L1315 590" class="ragLine"/>

  <text x="680" y="735" class="section">V6 RAG PIPELINE（已实现）</text>
  <line x1="680" y1="747" x2="920" y2="747" class="divider"/>

  <rect x="610" y="770" width="180" height="90" class="box rag"/>
  <text x="700" y="805" text-anchor="middle" class="label">DDL Retriever</text>
  <text x="700" y="830" text-anchor="middle" class="small">默认仅 DDL</text>
  <text x="700" y="850" text-anchor="middle" class="tiny">表结构语义召回 top-k</text>

  <rect x="810" y="770" width="180" height="90" class="box rag"/>
  <text x="900" y="805" text-anchor="middle" class="label">SampleValue</text>
  <text x="900" y="830" text-anchor="middle" class="small">仅显式样例</text>
  <text x="900" y="850" text-anchor="middle" class="tiny">敏感字段和值拒绝入库</text>

  <rect x="1010" y="770" width="180" height="90" class="box rag"/>
  <text x="1100" y="805" text-anchor="middle" class="label">Fusion</text>
  <text x="1100" y="830" text-anchor="middle" class="small">RRF / 去重 / 阈值</text>
  <text x="1100" y="850" text-anchor="middle" class="tiny">按 table_id 融合</text>

  <rect x="1210" y="770" width="180" height="90" class="box rag"/>
  <text x="1300" y="805" text-anchor="middle" class="label">Context Packer</text>
  <text x="1300" y="830" text-anchor="middle" class="small">Token Budget</text>
  <text x="1300" y="850" text-anchor="middle" class="tiny">无法容纳 → HTTP 413</text>

  <path d="M800 730 L700 770" class="ragLine"/>
  <path d="M800 730 L900 770" class="ragLine"/>
  <path d="M790 815 L1010 815" class="ragLine"/>
  <path d="M990 815 L1010 815" class="ragLine"/>
  <path d="M1190 815 L1210 815" class="ragLine"/>
  <path d="M1300 860 L1300 915" class="ragLine"/>

  <rect x="1180" y="915" width="240" height="74" class="box rag"/>
  <text x="1300" y="946" text-anchor="middle" class="label">一次主模型回答</text>
  <text x="1300" y="971" text-anchor="middle" class="small">ChatAgent(tools=[])；无 Tool Loop</text>

  <text x="1490" y="740" text-anchor="end" class="tiny">低分 → empty　·　歧义 → 确认提示　·　预算失败 → HTTP 413</text>

  <text x="70" y="772" class="section">CROSS-CUTTING</text>
  <line x1="70" y1="784" x2="520" y2="784" class="divider"/>

  <rect x="70" y="815" width="220" height="92" class="box storage"/>
  <text x="180" y="849" text-anchor="middle" class="label">IntentLLMAdapter</text>
  <text x="180" y="875" text-anchor="middle" class="small">独立意图模型</text>
  <text x="180" y="895" text-anchor="middle" class="tiny">LiteLLM Provider</text>

  <rect x="310" y="815" width="220" height="92" class="box storage"/>
  <text x="420" y="849" text-anchor="middle" class="label">Chat LLMAdapter</text>
  <text x="420" y="875" text-anchor="middle" class="small">主聊天模型</text>
  <text x="420" y="895" text-anchor="middle" class="tiny">LiteLLM Provider</text>

  <rect x="70" y="930" width="220" height="92" class="box storage"/>
  <text x="180" y="964" text-anchor="middle" class="label">SessionService</text>
  <text x="180" y="990" text-anchor="middle" class="small">SQLite</text>
  <text x="180" y="1010" text-anchor="middle" class="tiny">user_id + session_id</text>

  <rect x="310" y="930" width="220" height="92" class="box storage"/>
  <text x="420" y="964" text-anchor="middle" class="label">Context + Memory</text>
  <text x="420" y="990" text-anchor="middle" class="small">摘要 / Token / MEMORY.md</text>
  <text x="420" y="1010" text-anchor="middle" class="tiny">项目级长期记忆</text>

  <rect x="610" y="930" width="250" height="92" class="box rag"/>
  <text x="735" y="964" text-anchor="middle" class="label">Qwen Embedding</text>
  <text x="735" y="990" text-anchor="middle" class="small">text-embedding-v3</text>
  <text x="735" y="1010" text-anchor="middle" class="tiny">QWEN_API_KEY</text>

  <rect x="880" y="930" width="250" height="92" class="box rag"/>
  <text x="1005" y="964" text-anchor="middle" class="label">LanceDB Index</text>
  <text x="1005" y="990" text-anchor="middle" class="small">DDL / SampleValue</text>
  <text x="1005" y="1010" text-anchor="middle" class="tiny">namespace 同步与旧文档清理</text>

  <text x="70" y="1090" class="section">V7 NL2SQL LANGGRAPH（已实现）</text>
  <line x1="70" y1="1102" x2="1520" y2="1102" class="divider"/>

  <rect x="70" y="1130" width="175" height="76" class="box rag"/>
  <text x="157" y="1161" text-anchor="middle" class="label">SchemaLinking</text>
  <text x="157" y="1187" text-anchor="middle" class="tiny">候选表与 Schema evidence</text>

  <rect x="275" y="1130" width="175" height="76" class="box storage"/>
  <text x="362" y="1161" text-anchor="middle" class="label">ContextPrepare</text>
  <text x="362" y="1187" text-anchor="middle" class="tiny">历史 / 摘要 / MEMORY / Budget</text>

  <rect x="480" y="1130" width="175" height="76" class="box rag"/>
  <text x="567" y="1161" text-anchor="middle" class="label">GenSQL</text>
  <text x="567" y="1187" text-anchor="middle" class="tiny">LLMAdapter.complete(tools=[])</text>

  <rect x="685" y="1130" width="175" height="76" class="box rag"/>
  <text x="772" y="1161" text-anchor="middle" class="label">ValidateSQL</text>
  <text x="772" y="1187" text-anchor="middle" class="tiny">SQLGlot · 表列白名单 · 无 *</text>

  <rect x="890" y="1130" width="175" height="76" class="box rag"/>
  <text x="977" y="1161" text-anchor="middle" class="label">Execute</text>
  <text x="977" y="1187" text-anchor="middle" class="tiny">只读 Executor · 专用业务 SQLite</text>

  <rect x="1095" y="1130" width="175" height="76" class="box rag"/>
  <text x="1182" y="1161" text-anchor="middle" class="label">Reflection</text>
  <text x="1182" y="1187" text-anchor="middle" class="tiny">原因回流 · 最多 2 次</text>

  <rect x="1300" y="1130" width="175" height="76" class="box current"/>
  <text x="1387" y="1161" text-anchor="middle" class="label">Output</text>
  <text x="1387" y="1187" text-anchor="middle" class="tiny">结果 / SQL / usage / Memory 收尾</text>

  <path d="M245 1168 L275 1168" class="ragLine"/>
  <path d="M450 1168 L480 1168" class="ragLine"/>
  <path d="M655 1168 L685 1168" class="ragLine"/>
  <path d="M860 1168 L890 1168" class="ragLine"/>
  <path d="M1065 1168 L1095 1168" class="ragLine"/>
  <path d="M1270 1168 L1300 1168" class="ragLine"/>
  <path d="M1182 1206 C1182 1260 567 1260 567 1206" class="ragLine"/>
  <text x="875" y="1251" text-anchor="middle" class="tiny">regenerate 时回到 GenSQL（最多 3 次生成）；安全校验失败 → 422，预算失败 → 413，未启用或业务库不可用 → 503</text>

  <rect x="70" y="1300" width="1405" height="42" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="772" y="1327" text-anchor="middle" class="small">app/config.py：统一管理 Provider、模型、Base URL、API Key 环境变量、NL2SQL 开关与运行参数</text>

  <path d="M735 930 L735 860" class="ragLine"/>
  <path d="M860 976 L880 976" class="ragLine"/>
  <path d="M700 860 L700 930" class="ragLine"/>
  <path d="M900 860 L1005 930" class="ragLine"/>
</svg>
